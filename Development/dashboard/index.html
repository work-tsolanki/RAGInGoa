<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HH Goa RAG — Live Dashboard</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121722;
    --panel-alt: #171d2b;
    --border: #232b3d;
    --text: #e6e9ef;
    --text-dim: #8a93a6;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --warn: #e8b339;
    --bad: #ef5a5a;
    --mono: "Cascadia Code", "Consolas", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 0 0 auto; }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--bad);
    display: inline-block; margin-right: 6px; flex: 0 0 auto;
  }
  .status-dot.connected { background: var(--good); }
  #conn-label { font-size: 12px; color: var(--text-dim); }
  .spacer { flex: 1; }
  #query-form button {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  #query-form button:hover { filter: brightness(1.1); }
  #mic-language {
    background: var(--panel-alt); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer; flex: 0 0 auto;
  }
  #mic-btn {
    background: var(--panel-alt); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 600;
    flex: 0 0 auto;
  }
  #mic-btn:hover { filter: brightness(1.15); }
  #mic-btn.recording { background: var(--bad); color: white; border-color: var(--bad); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  #mic-status { font-size: 12px; color: var(--text-dim); flex: 0 0 auto; align-self: center; }

  main {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; background: var(--border); overflow: hidden;
  }
  .pane { background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
  .pane-header {
    padding: 10px 16px; font-size: 12px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-dim); border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  /* Left: live log */
  #log {
    flex: 1; overflow-y: auto; padding: 10px 14px; font-family: var(--mono); font-size: 12.5px;
  }
  .log-line {
    display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px dashed rgba(255,255,255,0.04);
    animation: fadein .15s ease-in;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(-2px);} to { opacity: 1; transform: translateY(0);} }
  .log-time { color: var(--text-dim); flex: 0 0 68px; }
  .log-badge {
    flex: 0 0 auto; padding: 1px 7px; border-radius: 4px; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em; height: fit-content;
  }
  .badge-start { background: rgba(91,140,255,0.15); color: var(--accent); }
  .badge-done { background: rgba(62,207,142,0.15); color: var(--good); }
  .badge-error { background: rgba(239,90,90,0.15); color: var(--bad); }
  .badge-final { background: rgba(232,179,57,0.18); color: var(--warn); }
  .log-msg { color: var(--text); flex: 1; }
  .log-msg .dim { color: var(--text-dim); }

  /* Right: query + results */
  #right-pane { overflow-y: auto; }
  #query-form {
    display: flex; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #query-input {
    flex: 1; background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: 8px; font-size: 14px;
  }
  #results { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .card h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim);
    margin: 0 0 10px 0; font-weight: 700;
  }
  #answer-text { font-size: 15px; line-height: 1.55; white-space: pre-wrap; }
  #answer-text.streaming::after {
    content: "▍"; display: inline-block; color: var(--accent);
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .score-row { display: flex; align-items: center; gap: 12px; }
  .score-bar-track {
    flex: 1; height: 10px; border-radius: 6px; background: var(--panel-alt); overflow: hidden;
  }
  .score-bar-fill { height: 100%; border-radius: 6px; transition: width .3s ease; }
  .score-value { font-family: var(--mono); font-size: 13px; font-weight: 700; width: 52px; text-align: right; }

  .latency-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12.5px; }
  .latency-label { flex: 0 0 90px; color: var(--text-dim); text-transform: capitalize; }
  .latency-bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--panel-alt); overflow: hidden; }
  .latency-bar-fill { height: 100%; border-radius: 4px; background: var(--accent); }
  .latency-value { flex: 0 0 60px; text-align: right; font-family: var(--mono); }
  .latency-row.total .latency-label, .latency-row.total .latency-value { color: var(--text); font-weight: 700; }
  .latency-row.total .latency-bar-fill { background: var(--warn); }

  .doc-item {
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .doc-item:last-child { border-bottom: none; }
  .doc-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; font-family: var(--mono); }
  .doc-content { font-size: 13px; color: var(--text); line-height: 1.4; }

  .empty-hint { color: var(--text-dim); font-size: 13px; padding: 8px 0; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

</style>
</head>
<body>
<div id="app">
  <header>
    <h1>HH Goa RAG — Live Dashboard</h1>
    <span class="status-dot" id="status-dot"></span>
    <span id="conn-label">disconnected</span>
    <div class="spacer"></div>
  </header>

  <main>
    <div class="pane" id="left-pane">
      <div class="pane-header">Live Pipeline Log</div>
      <div id="log"></div>
    </div>

    <div class="pane" id="right-pane">
      <form id="query-form">
        <input id="query-input" type="text" placeholder="Ask something in any supported language…" autocomplete="off" />
        <button type="submit">Ask</button>
        <select id="mic-language" title="Spoken language for the recording">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="gu">Gujarati</option>
          <option value="mr">Marathi</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="kn">Kannada</option>
          <option value="ml">Malayalam</option>
          <option value="bn">Bengali</option>
          <option value="pa">Punjabi</option>
          <option value="or">Odia</option>
          <option value="ur">Urdu</option>
          <option value="ne">Nepali</option>
          <option value="as">Assamese</option>
        </select>
        <button type="button" id="mic-btn">● Record</button>
        <span id="mic-status"></span>
      </form>
      <div id="results">
        <div class="card" id="answer-card">
          <h2>Answer</h2>
          <div id="answer-text" class="empty-hint">Ask a question to see the generated answer here.</div>
        </div>

        <div class="card" id="confidence-card">
          <h2>Grounding Confidence</h2>
          <div class="score-row">
            <div class="score-bar-track"><div class="score-bar-fill" id="confidence-fill" style="width:0%"></div></div>
            <div class="score-value" id="confidence-value">—</div>
          </div>
        </div>

        <div class="card" id="latency-card">
          <h2>Latency Breakdown</h2>
          <div id="latency-rows"><div class="empty-hint">No query run yet.</div></div>
        </div>

        <div class="card" id="docs-card">
          <h2>Retrieved Documents</h2>
          <div id="docs-list"><div class="empty-hint">No documents retrieved yet.</div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logEl = $("log");
  const statusDot = $("status-dot");
  const connLabel = $("conn-label");
  const queryForm = $("query-form");
  const queryInput = $("query-input");
  const micBtn = $("mic-btn");
  const micStatus = $("mic-status");
  const micLanguage = $("mic-language");

  let ws = null;
  let pendingRequestActive = false;
  let streamingAnswer = "";

  // The public dashboard connects to /ws/demo, not the key-gated /ws/query -
  // no RAG_API_KEY is ever needed here (or sent, stored, or rendered), so a
  // judge can use this page with zero setup. /ws/demo runs the identical
  // pipeline, gated by a per-IP rate limit server-side instead of a key -
  // see verify_demo_rate_limit / _check_demo_rate_limit in main_app.py.
  function wsUrl() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    return `${proto}://${location.host}/ws/demo`;
  }

  function setConnected(isConnected) {
    statusDot.classList.toggle("connected", isConnected);
    connLabel.textContent = isConnected ? "connected" : "disconnected";
    queryForm.querySelector("button").disabled = !isConnected;
  }

  function logLine(badgeClass, badgeText, html) {
    const line = document.createElement("div");
    line.className = "log-line";
    const time = new Date().toLocaleTimeString([], { hour12: false });
    line.innerHTML = `
      <span class="log-time">${time}</span>
      <span class="log-badge ${badgeClass}">${badgeText}</span>
      <span class="log-msg">${html}</span>
    `;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function connect() {
    if (ws) { try { ws.close(); } catch (e) {} }

    ws = new WebSocket(wsUrl());
    setConnected(false);
    connLabel.textContent = "connecting…";

    ws.onclose = (ev) => {
      setConnected(false);
      pendingRequestActive = false;
      logLine("badge-error", "conn", `WebSocket closed${ev.reason ? " — " + escapeHtml(ev.reason) : ""}`);
    };
    ws.onerror = () => {
      logLine("badge-error", "conn", "WebSocket error");
    };
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.stage === "auth" && msg.status === "ok") {
        setConnected(true);
        logLine("badge-done", "conn", "WebSocket connected & authenticated");
        return;
      }
      handleEvent(msg);
    };
  }

  function escapeHtml(s) {
    return (s ?? "").toString()
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function handleEvent(msg) {
    const stage = msg.stage;

    if (stage === "error") {
      logLine("badge-error", "error", escapeHtml(msg.message));
      pendingRequestActive = false;
      micStatus.textContent = "";
      return;
    }

    if (stage === "final") {
      logLine("badge-final", "final", `total <span class="dim">${msg.latency_breakdown.total}ms</span>`);
      renderAnswer(msg.answer, false);
      renderConfidence(msg.confidence);
      renderLatency(msg.latency_breakdown);
      renderDocs(msg.retrieved_documents);
      pendingRequestActive = false;
      micStatus.textContent = "";
      return;
    }

    // Per-token deltas as the answer streams in - update the Answer card
    // live but don't log each one, that would flood the pipeline log at
    // one line per token for a 100+ token answer.
    if (stage === "generation" && msg.status === "token") {
      streamingAnswer += msg.delta;
      renderAnswer(streamingAnswer, true);
      return;
    }

    // Sarvam's own live partial transcript while recording - update the
    // input box in real time but don't log each one (same flooding
    // concern as generation tokens above).
    if (stage === "stt" && msg.status === "partial") {
      queryInput.value = msg.transcript;
      return;
    }

    // stage start/done events: embedding, retrieval, generation, grounding
    if (msg.status === "start") {
      if (stage === "generation") streamingAnswer = "";
      logLine("badge-start", stage, "started…");
    } else if (msg.status === "done") {
      let extra = `<span class="dim">${msg.latency_ms}ms</span>`;
      if (stage === "retrieval") {
        extra += `<span class="dim"> · dense=${msg.dense_count} bm25=${msg.bm25_count}</span>`;
      }
      if (stage === "grounding") {
        extra += `<span class="dim"> · score=${msg.score}</span>`;
      }
      if (stage === "generation") {
        if (msg.backend) extra += `<span class="dim"> · backend=${escapeHtml(msg.backend)}</span>`;
        if (msg.cache_hit) extra += `<span class="dim"> · cache hit</span>`;
        else if (msg.first_token_ms != null) extra += `<span class="dim"> · first token ${msg.first_token_ms}ms</span>`;
        if (msg.answer) {
          extra += `<span class="dim"> · "${escapeHtml(msg.answer.slice(0, 60))}${msg.answer.length > 60 ? "…" : ""}"</span>`;
        }
      }
      if (stage === "stt" && msg.transcript) {
        extra += `<span class="dim"> · "${escapeHtml(msg.transcript)}"</span>`;
        queryInput.value = msg.transcript;
      }
      logLine("badge-done", stage, extra);
      if (stage === "merge" && msg.documents) {
        renderDocs(msg.documents.map(d => ({ ...d })));
      }
    }
  }

  function renderAnswer(answer, streaming) {
    const el = $("answer-text");
    el.classList.remove("empty-hint");
    el.classList.toggle("streaming", !!streaming);
    el.textContent = answer;
  }

  function renderConfidence(score) {
    const pct = Math.max(0, Math.min(1, score)) * 100;
    const fill = $("confidence-fill");
    fill.style.width = pct + "%";
    fill.style.background = pct >= 60 ? "var(--good)" : pct >= 30 ? "var(--warn)" : "var(--bad)";
    $("confidence-value").textContent = score.toFixed(3);
  }

  function renderLatency(breakdown) {
    const rows = $("latency-rows");
    rows.innerHTML = "";
    const total = breakdown.total || 1;
    const order = ["stt", "embedding", "retrieval", "merge", "generation", "grounding", "total"];
    order.forEach((key) => {
      if (!(key in breakdown)) return;
      const val = breakdown[key];
      const pct = Math.min(100, (val / total) * 100);
      const row = document.createElement("div");
      row.className = "latency-row" + (key === "total" ? " total" : "");
      row.innerHTML = `
        <div class="latency-label">${key}</div>
        <div class="latency-bar-track"><div class="latency-bar-fill" style="width:${pct}%"></div></div>
        <div class="latency-value">${val.toFixed(1)}ms</div>
      `;
      rows.appendChild(row);
    });
  }

  function renderDocs(docs) {
    const list = $("docs-list");
    if (!docs || !docs.length) { list.innerHTML = '<div class="empty-hint">No documents retrieved.</div>'; return; }
    list.innerHTML = "";
    docs.forEach((doc, i) => {
      const item = document.createElement("div");
      item.className = "doc-item";
      item.innerHTML = `
        <div class="doc-meta"><span>#${i + 1} · ${escapeHtml(doc.doc_id)}</span><span>score ${Number(doc.score).toFixed(3)}</span></div>
        <div class="doc-content">${escapeHtml(doc.content)}</div>
      `;
      list.appendChild(item);
    });
  }

  queryForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = queryInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN || pendingRequestActive) return;
    pendingRequestActive = true;
    logLine("badge-start", "query", `“${escapeHtml(text)}”`);
    ws.send(JSON.stringify({ query_text: text }));
  });

  // Real-time speech-to-text: audio is streamed to the server as raw 16kHz
  // mono PCM chunks WHILE recording (not uploaded as one file after
  // stopping), so Sarvam's saaras:v3-realtime model transcribes
  // concurrently with speech. The "stt" stage "partial" events below are
  // Sarvam's own live transcript (not a separate browser-side guess), so
  // what you see appearing in the box IS what's actually being heard by
  // the engine that will answer the question. See RealtimeSttSession /
  // _relay_realtime_stt in the backend for the other half of this.
  let audioCtx = null;
  let micStream = null;
  let micSourceNode = null;
  let micProcessorNode = null;
  let isRecording = false;

  function setMicUI(recording, statusText) {
    micBtn.classList.toggle("recording", recording);
    micBtn.textContent = recording ? "■ Stop" : "● Record";
    micStatus.textContent = statusText || "";
    micLanguage.disabled = recording;
  }

  function float32ToPcm16Base64(float32Array) {
    const buffer = new ArrayBuffer(float32Array.length * 2);
    const view = new DataView(buffer);
    for (let i = 0; i < float32Array.length; i++) {
      const s = Math.max(-1, Math.min(1, float32Array[i]));
      view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    let binary = "";
    const bytes = new Uint8Array(buffer);
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  async function toggleRecording() {
    if (pendingRequestActive) return;
    if (isRecording) {
      stopRecording();
      return;
    }
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      logLine("badge-error", "mic", `Microphone access denied: ${escapeHtml(e.message)}`);
      return;
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioCtx({ sampleRate: 16000 });
    micStream = stream;
    micSourceNode = audioCtx.createMediaStreamSource(stream);
    // ScriptProcessorNode is deprecated but needs no separate worklet
    // module file to serve - fine for this scope. 4096 samples @ 16kHz =
    // 256ms chunks, matching what was verified against the real Sarvam API.
    micProcessorNode = audioCtx.createScriptProcessor(4096, 1, 1);
    micProcessorNode.onaudioprocess = (event) => {
      if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;
      const chunk = float32ToPcm16Base64(event.inputBuffer.getChannelData(0));
      ws.send(JSON.stringify({ type: "audio_chunk", chunk }));
    };
    micSourceNode.connect(micProcessorNode);
    // Silent output (we never write to outputBuffer) - connecting to
    // destination is what makes onaudioprocess actually fire reliably.
    micProcessorNode.connect(audioCtx.destination);

    isRecording = true;
    queryInput.value = "";
    setMicUI(true, "recording…");
    ws.send(JSON.stringify({ type: "audio_stream_start", language: micLanguage.value }));
  }

  function stopRecording() {
    isRecording = false;
    if (micProcessorNode) { micProcessorNode.disconnect(); micProcessorNode.onaudioprocess = null; micProcessorNode = null; }
    if (micSourceNode) { micSourceNode.disconnect(); micSourceNode = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    setMicUI(false, "transcribing…");
    if (ws && ws.readyState === WebSocket.OPEN) {
      pendingRequestActive = true;
      ws.send(JSON.stringify({ type: "audio_stream_end" }));
    }
  }

  micBtn.addEventListener("click", toggleRecording);

  connect();
})();
</script>
</body>
</html>
