app = "ragingoa"  # fallback if taken: ragingoa-hhg2026
primary_region = "sin"  # Singapore - bom (Mumbai) had no VM capacity available at deploy time

[build]
  # Pinned to the exact image actually serving traffic (verified live and
  # healthy at deploy time), not the Dockerfile - `image` and `dockerfile`
  # are mutually exclusive in Fly's build config, and `image` wins even
  # when a CLI flag says otherwise (confirmed: `--dockerfile` was silently
  # ignored while this was set). To ship a Dockerfile change: temporarily
  # set this back to `dockerfile = "Dockerfile"`, run
  # `fly deploy --build-only --push`, then re-pin this line to the new
  # tag/digest before deploying - don't leave it unpinned, or the next bare
  # `fly deploy` rebuilds from source and silently drifts from what was
  # actually verified.
  image = "registry.fly.io/ragingoa:deployment-01M0E8MV98F5HZF3XQHFZ5NNS8@sha256:fb9c5be86b84f886d647a4dbd937fd781bb5f0a328b6987b031a83f1cc2f5b0f"

[env]
  # Local llama.cpp fallback needs a GPU; Fly's standard machines don't have
  # one, so production skips straight from Groq to Claude. No code change
  # needed - config.py already reads this override (see GENERATION_BACKEND_ORDER
  # in config.py). Local generation code stays in generation_service.py,
  # just unreachable here.
  GENERATION_BACKEND_ORDER_OVERRIDE = "groq,claude"
  # Corpus lives on the mounted volume below, not in the image - see .dockerignore
  # and config.py for why (a 9.3GB image with the data baked in consistently
  # failed to start: confirmed via a trivial hello-world image starting instantly
  # on this same app/region/config, isolating the problem to image size/pull time).
  CHROMA_PERSIST_DIR = "/data/chroma_db"
  BM25S_INDEX_DIR = "/data/bm25s_index_full"

[mounts]
  source = "ragingoa_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep false through the judging window (through Aug 22) -
                                # prevents cold-start WebSocket failures during a live demo
  auto_start_machines = true
  min_machines_running = 1     # always-on, no scale-to-zero during judging period

[[vm]]
  cpu_kind = "shared"
  cpus = 4            # shared-cpu machines cap memory at 2048MB per vCPU - 4 vCPUs needed to
                      # unlock 8192MB (a 2-vCPU/8192MB combo is rejected by Fly outright)
  memory_mb = 8192   # bumped from 4096 after the corpus expansion (743k -> 1.04M chunks,
                      # chroma_db 3.7G -> 5.0G) pushed boot-time RSS to ~3.57GB out of the old
                      # 4.01GB total - right at the OOM edge while loading the embedding model,
                      # cross-encoder, and touching the larger Chroma/BM25 indexes. Confirmed via
                      # `flyctl ssh console -C "cat /proc/<uvicorn-pid>/status"` mid-boot.
